name: Check educator guide kit
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  recipe:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python3 -B tools/verify_commit_identity.py --self-test
      - run: python3 -B tools/verify_commit_identity.py
      - run: python3 -B tools/test_build.py
      - run: python3 -B tools/verify.py
      - run: python3 -B tools/build.py --profile profiles/example-school.json --output "$RUNNER_TEMP/example-guides"
      - run: python3 -B tools/build.py --profile profiles/big-lever.json --output "$RUNNER_TEMP/big-lever-guides"
